name: Shared core contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: fonyx-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified tag
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified tag
        with:
          distribution: temurin
          java-version: '17'
      - run: javac --release 17 -d verification/crypto apps/mobile/android/app/src/main/java/com/helloworld/IdentityCrypto.java apps/mobile/android/app/src/main/java/com/helloworld/PackDownload.java test/IdentityCryptoTest.java test/PackDownloadTest.java
      - run: java -ea -cp verification/crypto studios.fonyx.launcher.IdentityCryptoTest
      - run: java -ea -cp verification/crypto studios.fonyx.launcher.PackDownloadTest
  desktop-payload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/build-shared-ui.cjs
      - run: node tools/build-desktop-payload.cjs
  android-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - run: node tools/build-stamp.cjs
      - name: Build our native Microsoft provider from source
        working-directory: native/accountengine
        env:
          GOTOOLCHAIN: go1.27.4
        run: |
          go version
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261117202452-47699113848a
          export PATH="$(go env GOPATH)/bin:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' >/dev/null || test -d "$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          mkdir -p ../../apps/mobile/android/app/libs
          gomobile bind -target android/arm64,android/amd64 -androidapi 29 -ldflags='-extldflags=-Wl,-z,max-page-size=16384' -javapkg studios.fonyx.auth -o ../../apps/mobile/android/app/libs/fonyx-account.aar .
      - name: Generate a disposable test signing key
        run: keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Fonyx CI Debug,O=Fonyx,C=MX"
      - name: Compile APK (test signing, no release publication)
        working-directory: apps/mobile/android
        run: bash gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - run: python3 tools/check-android-native.py apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-input
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          retention-days: 3
          if-no-files-found: error
  android-emulator:
    needs: android-compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 34, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-test-input
          path: verification/apks
      - name: Enable KVM for the ephemeral test runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tools/android-emulator-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: verification/android-emulator
          retention-days: 7
          if-no-files-found: warn
