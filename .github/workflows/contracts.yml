name: Shared core contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified tag
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified tag
        with:
          distribution: temurin
          java-version: '17'
      - run: javac --release 17 -d verification/crypto apps/mobile/android/app/src/main/java/com/helloworld/IdentityCrypto.java test/IdentityCryptoTest.java
      - run: java -ea -cp verification/crypto studios.fonyx.launcher.IdentityCryptoTest
  desktop-payload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/build-desktop-payload.cjs
  android-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - run: node tools/build-stamp.cjs
      - name: Generate a disposable test signing key
        run: keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Fonyx CI Debug,O=Fonyx,C=MX"
      - name: Compile APK (test signing, no release publication)
        working-directory: apps/mobile/android
        run: bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
