<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de carga · Fonyx</title><link rel="stylesheet" href="loading.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#09142166,#091421dd),url('../../assets/map.png') center/cover fixed;color:#f0f3f9;font:15px system-ui}main{width:min(500px,92vw);padding:30px 40px;background:#142131ed;border:1px solid #63748c66;border-radius:12px;box-shadow:0 30px 100px #0007;text-align:center;animation:load-enter .4s ease-out}h1{font-size:22px;margin:0 0 12px}p{color:#bbcadc;font-size:14px}progress{width:100%;height:7px;accent-color:#ffd465}section{display:flex;gap:10px;justify-content:center;margin-top:26px}button,select{border:1px solid #63748c;background:#202f43;color:inherit;padding:11px 15px;border-radius:5px;font:inherit}button{cursor:pointer;transition:transform .15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(1px)}button:focus-visible,select:focus-visible{outline:2px solid #ffd465;outline-offset:3px}.meta{display:flex;justify-content:space-between;font-size:12px;color:#bbcadc;margin-top:10px}small{display:block;color:#bbcadc;margin-top:24px;font-size:12px}
</style></head><body><main><div class="loading-art" data-style="diamond"><span class="loading-diamond" aria-hidden="true"></span><canvas id="loading-roulette" width="432" height="424" aria-label="Ruleta de Jugosafio" hidden></canvas><img id="update-logo" class="update-logo" src="../../assets/jugosafio.png" alt="Jugosafio R"></div><h1 id="title">Actualizando recursos</h1><p id="message" role="status">Comprobando packs…</p><progress id="bar" max="100" value="0" aria-label="Progreso de demostración"></progress><div class="meta"><span>Vista previa</span><span id="percent">0 %</span></div><section><select id="style" aria-label="Animación"><option value="diamond">Rombo clásico</option><option value="roulette">Ruleta de Jugosafio</option></select><button id="replay">Repetir</button></section><small>Simulación visual. No descarga ni abre Minecraft.</small></main><script src="loading.js"></script><script>
let timer;function replay(){clearInterval(timer);const start=performance.now();document.querySelector('#title').textContent='Actualizando recursos';window.fonyxLoading.start(document.querySelector('#style').value);timer=setInterval(()=>{const n=Math.min(100,Math.floor((performance.now()-start)/90));document.querySelector('#bar').value=n;document.querySelector('#percent').textContent=n+' %';document.querySelector('#message').textContent=n<12?'Comprobando packs…':n<90?'Descargando recursos…':n<100?'Verificando archivos…':'Recursos actualizados';if(n===100){clearInterval(timer);window.fonyxLoading.stop();document.querySelector('#title').textContent='Listo';}},60)}document.querySelector('#style').onchange=replay;document.querySelector('#replay').onclick=replay;replay();
</script></body></html>
